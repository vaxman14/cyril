<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You — Schedule Your Consultation | Chef Cyril Kabaoglu</title>
  <link rel="icon" href="/images/cyril-favicon.png" type="image/png" />
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --bg: #0d0d0d; --gold: #c9a227; --cream: #f0ede8; --muted: #9b8a6e; --border: #2a2a2a; }
    body {
      background: var(--bg); color: var(--cream);
      font-family: 'Inter', sans-serif; font-weight: 300; line-height: 1.7;
      min-height: 100vh; padding: 4rem 2rem 5rem;
      display: flex; flex-direction: column; align-items: center; text-align: center;
    }
    .rule { width: 60px; height: 1px; background: var(--gold); margin: 0 auto 2rem; }
    .eyebrow {
      font-family: 'Inter', sans-serif; font-weight: 500; font-size: 0.7rem;
      letter-spacing: 0.35em; color: var(--gold); text-transform: uppercase; margin-bottom: 1.25rem;
    }
    h1 {
      font-family: 'Playfair Display', serif; font-weight: 900;
      font-size: clamp(2.2rem, 6vw, 3.8rem); color: var(--cream); line-height: 1.1; margin-bottom: 1.5rem;
    }
    p { color: var(--muted); font-size: 1.1rem; max-width: 54ch; margin: 0 auto 1.25rem; }
    .schedule-label {
      font-family: 'Inter', sans-serif; font-weight: 500; font-size: 0.72rem;
      letter-spacing: 0.25em; color: var(--gold); text-transform: uppercase;
      margin: 3.5rem auto 1.5rem;
    }
    .calendly-inline-widget {
      min-width: 320px; width: 100%; max-width: 1000px; height: 700px; margin: 0 auto;
      border: 1px solid var(--border); border-radius: 4px; overflow: hidden;
    }
    .fallback { font-size: 0.95rem; margin-top: 1.5rem; }
    .fallback a { color: var(--gold); text-decoration: none; }
    .fallback a:hover { text-decoration: underline; }
    .home-link {
      display: inline-block; margin-top: 2.5rem; border: 1px solid var(--border); color: var(--muted);
      padding: 12px 36px; letter-spacing: 0.2em; font-size: 0.75rem; text-transform: uppercase;
      text-decoration: none; transition: border-color 0.3s ease, color 0.3s ease;
    }
    .home-link:hover { border-color: var(--gold); color: var(--gold); }
  </style>
</head>
<body>
  <div class="rule"></div>
  <p class="eyebrow">Request Received</p>
  <h1>Thank You.</h1>
  <p>Your request has reached Chef Cyril. The final step: book a short consultation call below so he can understand your needs and recommend the right service.</p>

  <p class="schedule-label">— Schedule Your Consultation Call —</p>

  <!-- Calendly inline widget -->
  <div class="calendly-inline-widget" data-url="https://calendly.com/cyril7th/chef-cyril-consultation-call?background_color=0d0d0d&text_color=f0ede8&primary_color=c9a227"></div>
  <script type="text/javascript" src="https://assets.calendly.com/assets/external/widget.js" async></script>

  <p class="fallback">Can't see the scheduler? <a href="https://calendly.com/cyril7th/chef-cyril-consultation-call" target="_blank" rel="noopener">Open it in a new tab</a>.</p>

  <a href="/" class="home-link">Back to Home</a>
</body>
</html>
